title: Blog
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: excerpt
            field:
              buttons:
                - bold
                - italic
                - link
              type: markdown
              display: Excerpt
              instructions: 'Displays on index pages and card views.'
          -
            import: group_bard
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: categories
            field:
              type: terms
              taxonomies:
                - categories
              display: Categories
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              inline: true
              earliest_date: '2024-02-16'
              display: 'Date Field'
              validate:
                - required
          -
            handle: author
            field:
              type: users
              display: Author
              default: current
              localizable: true
              max_items: 1
          -
            handle: image
            field:
              mode: grid
              container: assets
              type: assets
              display: Image
      -
        display: Categories
