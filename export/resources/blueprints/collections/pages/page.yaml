title: Page
tabs:
  main:
    display: Main
    sections:
      -
        display: Configuration
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              localizable: true
              listable: true
              display: Title
              validate:
                - required
          -
            import: group_page_config
      -
        display: 'Page Builder'
        fields:
          -
            import: page_blocks
  sidebar:
    display: Sidebar
    sections:
      -
        display: Meta
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - required
              display: Slug
