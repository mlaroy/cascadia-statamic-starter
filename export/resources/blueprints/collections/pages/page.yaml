title: Page
tabs:
  main:
    display: Main
    sections:
      -
        display: Configuration
        collapsible: true
        collapsed: false
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              localizable: true
              listable: true
              display: Title
              validate:
                - required
          -
            handle: main_header_style
            field:
              options:
                -
                  key: default
                  value: Default
                -
                  key: transparent
                  value: Transparent
              default: default
              type: radio
              display: 'Main Header Style'
              inline: true
          -
            handle: show_page_title
            field:
              type: toggle
              display: 'Show Page Title'
          -
            handle: use_banner
            field:
              inline_label: 'Use banner'
              inline_label_when_true: 'Uses banner'
              type: toggle
              display: 'Use Banner'
              if:
                show_page_title: 'equals true'
          -
            handle: banner
            field:
              max_files: 1
              mode: grid
              container: assets
              type: assets
              display: Banner
              if:
                use_banner: 'equals true'
                show_page_title: 'equals true'
      -
        display: 'Page Blocks'
        collapsible: true
        collapsed: false
        fields:
          -
            import: page_blocks
  sidebar:
    display: Sidebar
    sections:
      -
        display: 'Meta and SEO'
        collapsible: true
        collapsed: false
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - required
              display: Slug
          -
            import: seo_fields
