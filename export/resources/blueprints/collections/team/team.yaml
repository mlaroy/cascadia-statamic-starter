title: Team
tabs:
  main:
    display: Main
    sections:
      -
        display: Configuration
        collapsible: true
        collapsed: false
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field:
              type: markdown
              display: Content
              localizable: true
          -
            import: team_member
      -
        display: 'Page Config'
        collapsible: true
        collapsed: false
        fields:
          -
            import: page_config
  sidebar:
    display: Sidebar
    sections:
      -
        display: Image
        collapsible: true
        collapsed: false
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            import: seo_fields
      -
        display: Image
        fields:
          -
            handle: headshot
            field:
              max_files: 1
              mode: grid
              container: assets
              type: assets
              display: Headshot
