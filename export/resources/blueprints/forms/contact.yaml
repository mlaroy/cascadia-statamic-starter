tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
              validate:
                - required
          -
            handle: email
            field:
              input_type: email
              type: text
              display: Email
              placeholder: your@email.com
              validate:
                - required
          -
            handle: content
            field:
              type: textarea
              display: Content
              validate:
                - required
