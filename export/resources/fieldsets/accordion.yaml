title: Accordion
fields:
  -
    handle: description
    field:
      buttons:
        - bold
        - italic
        - anchor
      remove_empty_nodes: false
      type: bard
      display: Description
  -
    handle: accordion_group
    field:
      type: replicator
      display: 'Accordion Group'
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            accordion_group:
              display: 'Accordion Group'
              fields:
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                -
                  handle: content
                  field:
                    remove_empty_nodes: false
                    type: bard
                    display: Content
