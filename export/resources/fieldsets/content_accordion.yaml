title: 'Content - Accordion'
fields:
  -
    import: group_theme
  -
    import: group_content
  -
    handle: accordion_group
    field:
      type: replicator
      display: 'Accordion Group'
      collapse: true
      sets:
        accordion:
          display: Accordion
          sets:
            accordion_group:
              display: 'Accordion Item'
              fields:
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                -
                  handle: content
                  field:
                    remove_empty_nodes: false
                    type: bard
                    display: Content
