title: '50/50 Split'
fields:
  -
    handle: sections
    field:
      type: replicator
      display: Sections
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            section:
              display: Section
              icon: layout-split-verical
              fields:
                -
                  handle: orientation
                  field:
                    options:
                      left: 'Content Left'
                      right: 'Content Right'
                    inline: true
                    default: right
                    type: radio
                    display: Orientation
                -
                  handle: image
                  field:
                    mode: grid
                    container: assets
                    type: assets
                    display: Image
                -
                  handle: eyebrow_text
                  field:
                    type: text
                    display: 'Eyebrow Text'
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                -
                  handle: content
                  field:
                    buttons:
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                      - quote
                      - link
                    type: markdown
                    display: Content
                -
                  import: link
