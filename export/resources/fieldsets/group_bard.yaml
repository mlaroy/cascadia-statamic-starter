title: 'Group - Bard'
fields:
  -
    handle: bard_content
    field:
      buttons:
        - h2
        - h3
        - h4
        - bold
        - italic
        - unorderedlist
        - orderedlist
        - anchor
      toolbar_mode: floating
      remove_empty_nodes: false
      always_show_set_button: true
      type: bard
      display: Content
      sets:
        content_items:
          display: 'Content Items'
          sets:
            set_blockquote:
              display: 'Block Quote'
              icon: text-formatting-quotation
              fields:
                -
                  import: set_blockquote
            set_image:
              display: Image
              icon: media-image-picture-orientation
              fields:
                -
                  import: set_image
            set_image_carousel:
              display: 'Image Carousel'
              icon: media-image-picture-gallery
              fields:
                -
                  import: set_image_carousel
            set_tabbed_content:
              display: 'Tabbed Content'
              icon: layout-table-column-insert
              fields:
                -
                  import: set_tabbed_content
            set_embed:
              display: Embed
              icon: media-webcam-video
              fields:
                -
                  import: set_embed
            set_buttons:
              display: Buttons
              icon: direction-buttons
              fields:
                -
                  import: set_buttons
