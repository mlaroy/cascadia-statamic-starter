title: 'Intro Section'
fields:
  -
    handle: intro_layout
    field:
      options:
        vertical: Vertical
        horizontal: Horizontal
      inline: true
      type: radio
      display: Layout
  -
    handle: eyebrow_text
    field:
      type: text
      display: 'Eyebrow Text'
  -
    handle: heading
    field:
      type: text
      display: Heading
  -
    handle: intro_text
    field:
      buttons:
        - h2
        - h3
        - bold
        - italic
        - removeformat
        - quote
        - anchor
      remove_empty_nodes: false
      type: bard
      display: 'Intro Text'
  -
    import: link
