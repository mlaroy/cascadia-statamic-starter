title: 'Large Media'
fields:
  -
    import: content_group
  -
    handle: media_type
    field:
      options:
        -
          key: image
          value: Image
        -
          key: video
          value: Video
      default: image
      type: radio
      display: 'Media Type'
      inline: true
  -
    handle: image
    field:
      max_files: 1
      mode: grid
      container: assets
      type: assets
      display: Image
      if:
        media_type: 'equals image'
  -
    handle: video
    field:
      type: video
      display: Video
      if:
        media_type: 'equals video'
