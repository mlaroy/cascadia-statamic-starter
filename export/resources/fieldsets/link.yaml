title: Link
fields:
  -
    handle: link_style
    field:
      options:
        -
          key: link
          value: Link
        -
          key: button
          value: Button
        -
          key: inverted
          value: Inverted
        -
          key: ghost
          value: Ghost
      inline: true
      default: link
      type: radio
      display: 'Link Style'
  -
    handle: link_to_external
    field:
      type: toggle
      display: 'Link to External'
  -
    handle: linked_entry
    field:
      max_items: 1
      mode: select
      type: entries
      display: 'Linked Entry'
      width: 50
  -
    handle: external_link
    field:
      input_type: url
      placeholder: 'https://example.com'
      type: text
      display: 'External Link'
      width: 50
      if:
        link_to_external: 'equals true'
