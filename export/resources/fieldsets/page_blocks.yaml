title: 'Page Blocks'
fields:
  -
    handle: page_blocks
    field:
      type: replicator
      localizable: true
      hide_display: true
      collapse: true
      listable: false
      display: 'Page Blocks'
      sets:
        complex_blocks:
          display: Complex
          instructions: Accordions, Google Maps, Tabs Explorer.
          icon: programming-script-code-brackets
          sets:
            accordion:
              display: Accordion
              icon: layout-table-row-insert
              fields:
                -
                  import: theme
                -
                  import: content_group
                -
                  import: accordion
            google_map:
              display: 'Google Map'
              icon: travel-map
              fields:
                -
                  import: theme
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                -
                  import: google_map_locations
            tabs_explorer:
              display: 'Tabs Explorer'
              icon: layout-header-sidebar-left
              fields:
                -
                  import: theme
                -
                  import: side_tabs_explorer
        text:
          display: Content
          instructions: 'Text and Entry links.'
          icon: mail-chat-bubble-text
          sets:
            basic_content:
              display: 'Basic Content'
              icon: form-text-field
              fields:
                -
                  import: blog_content_with_sets
            intro:
              display: Intro
              icon: text-formatting-image-top
              fields:
                -
                  import: theme
                -
                  handle: eyebrow_text
                  field:
                    type: text
                    display: 'Eyebrow Text'
                -
                  import: intro_section
            blog_teaser:
              display: 'Blog Teaser'
              icon: file-content-list
              fields:
                -
                  import: theme
                -
                  import: blog_teasers
            team_members:
              display: 'Team Members'
              icon: user-avatar
              fields:
                -
                  import: theme
                -
                  import: team_teasers
            fifty_split:
              display: '50/50 Split'
              icon: layout-split-verical
              fields:
                -
                  import: theme
                -
                  import: fifty_split
            testimonials:
              display: Testimonials
              icon: text-formatting-quotation
              fields:
                -
                  import: testimonials
            cta_bumper:
              display: 'CTA Bumper'
              icon: text-formatting-image-top
              fields:
                -
                  import: theme
                -
                  import: cta_bumper
            callout_grid:
              display: 'Callout Grid'
              icon: layout-grid-dots
              fields:
                -
                  import: theme
                -
                  import: callout_grid
            image_callout:
              display: 'Image Callout'
              icon: media-image-photo-focus-frame
              fields:
                -
                  import: theme
                -
                  import: image_callout
            stats:
              display: Stats
              icon: layout-three-columns
              fields:
                -
                  import: theme
                -
                  import: stats
            jobs:
              display: Jobs
              icon: user-avatar
              fields:
                -
                  import: theme
                -
                  import: jobs_block
        hero:
          display: Hero
          instructions: Basic Hero, Video Hero.
          icon: layout-flip-down
          sets:
            basic_hero:
              display: Hero
              icon: layout-header
              fields:
                -
                  import: theme
                -
                  handle: eyebrow_text
                  field:
                    type: text
                    display: 'Eyebrow Text'
                -
                  handle: heading
                  field:
                    type: text
                    display: Heading
                -
                  handle: description
                  field:
                    buttons:
                      - bold
                      - italic
                      - anchor
                    remove_empty_nodes: false
                    type: bard
                    display: Description
                -
                  handle: featured_image
                  field:
                    max_files: 1
                    mode: grid
                    container: assets
                    type: assets
                    display: 'Featured Image'
                -
                  import: link
            hero:
              display: 'Video Hero'
              icon: align-object-top
              fields:
                -
                  import: theme
                -
                  handle: main_heading
                  field:
                    type: text
                    display: 'Main Heading'
                -
                  handle: sub_heading
                  field:
                    type: text
                    display: 'Sub Heading'
                -
                  handle: background_option
                  field:
                    options:
                      -
                        key: image
                        value: Image
                      -
                        key: video
                        value: Video
                    default: image
                    type: radio
                    display: 'Background Media'
                    inline: true
                    width: 50
                -
                  handle: video_source
                  field:
                    options:
                      -
                        key: vimeo
                        value: Vimeo
                      -
                        key: youtube
                        value: YouTube
                      -
                        key: asset
                        value: 'Video Asset'
                    default: vimeo
                    type: radio
                    display: 'Video Source'
                    inline: true
                    width: 50
                    if:
                      background_option: 'equals video'
                -
                  handle: background_image
                  field:
                    container: assets
                    type: assets
                    display: 'Background Image'
                    if:
                      background_option: 'equals image'
                -
                  handle: vimeo_id
                  field:
                    placeholder: '449787858'
                    type: text
                    display: 'Vimeo ID'
                    if:
                      background_option: 'equals video'
                      video_source: 'equals vimeo'
                -
                  handle: youtube_id
                  field:
                    placeholder: dQw4w9WgXcQ
                    type: text
                    display: 'YouTube ID'
                    if:
                      background_option: 'equals video'
                      video_source: 'equals youtube'
                -
                  handle: video_file
                  field:
                    max_files: 1
                    mode: grid
                    container: assets
                    type: assets
                    display: 'Video File'
                    if:
                      background_option: 'equals video'
                      video_source: 'equals asset'
                -
                  handle: cta_link
                  field:
                    max_items: 1
                    collections:
                      - pages
                    type: entries
                    display: 'CTA Link'
                    width: 50
                -
                  handle: cta_text
                  field:
                    placeholder: 'Learn more'
                    type: text
                    display: 'CTA Text'
                    width: 50
                -
                  handle: show_modal
                  field:
                    type: toggle
                    display: 'Show Modal Items?'
                -
                  import: modal_popup
                -
                  handle: darken_bg
                  field:
                    type: toggle
                    display: 'Darken BG'
                    instructions: 'Enable to add an overlay over the background, to ensure contrast with the text in the foreground.'
        media:
          display: Media
          instructions: Logo Cloud, Large Media.
          sets:
            image_carousel:
              display: 'Image Carousel'
              icon: media-image-picture-gallery
              fields:
                -
                  import: theme
                -
                  import: content_group
                -
                  import: image_carousel
            logo_cloud:
              display: 'Logo Cloud'
              icon: favorite-award
              fields:
                -
                  import: logo_cloud
            large_media:
              display: 'Large Media'
              icon: media-webcam-video
              fields:
                -
                  import: theme
                -
                  import: large_media
