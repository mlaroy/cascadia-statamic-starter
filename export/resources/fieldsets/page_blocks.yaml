title: 'Page Blocks'
fields:
  -
    handle: page_blocks
    field:
      type: replicator
      localizable: true
      hide_display: true
      collapse: true
      listable: false
      display: 'Page Builder'
      sets:
        hero:
          display: Hero
          icon: layout-flip-down
          sets:
            content_basic_hero:
              display: 'Basic Hero'
              icon: layout-header
              fields:
                -
                  import: content_basic_hero
            content_video_hero:
              display: 'Video Hero'
              icon: align-object-top
              fields:
                -
                  import: content_video_hero
        content:
          display: Content
          icon: mail-chat-bubble-text
          sets:
            content_basic_content:
              display: 'Basic Content'
              icon: form-text-field
              fields:
                -
                  import: content_basic_content
            content_intro:
              display: Intro
              icon: text-formatting-image-top
              fields:
                -
                  import: content_intro
            content_blog_teaser:
              display: 'Blog Teaser'
              icon: file-content-list
              fields:
                -
                  import: content_blog_teaser
            content_team_members:
              display: 'Team Members'
              icon: user-avatar
              fields:
                -
                  import: content_team_members
            content_fifty_split:
              display: '50/50 Split'
              icon: layout-split-verical
              fields:
                -
                  import: content_fifty_split
            content_testimonials:
              display: Testimonials
              icon: text-formatting-quotation
              fields:
                -
                  import: content_testimonials
            content_stats:
              display: Stats
              icon: layout-three-columns
              fields:
                -
                  import: content_stats
            content_jobs:
              display: Jobs
              icon: user-avatar
              fields:
                -
                  import: content_jobs
        callouts:
          display: Callouts
          icon: share-mega-phone
          sets:
            callout_cta_bumper:
              display: 'CTA Bumper'
              icon: text-formatting-image-top
              fields:
                -
                  import: callout_cta_bumper
            callout_grid:
              display: 'Callout Grid'
              icon: layout-grid-dots
              fields:
                -
                  import: callout_grid
            callout_image:
              display: 'Image Callout'
              icon: media-image-photo-focus-frame
              fields:
                -
                  import: callout_image
        media:
          display: Media
          icon: media-image-picture-gallery
          sets:
            content_image_carousel:
              display: 'Image Carousel'
              icon: media-image-picture-gallery
              fields:
                -
                  import: content_image_carousel
            content_logo_cloud:
              display: 'Logo Cloud'
              icon: favorite-award
              fields:
                -
                  import: content_logo_cloud
            content_large_media:
              display: 'Large Media'
              icon: media-webcam-video
              fields:
                -
                  import: content_large_media
        complex:
          display: Complex
          icon: programming-script-code-brackets
          instructions: 'Accordions, Google Maps, Tabs Explorer.'
          sets:
            content_accordion:
              display: Accordion
              icon: layout-table-row-insert
              fields:
                -
                  import: content_accordion
            content_google_map:
              display: 'Google Map'
              icon: travel-map
              fields:
                -
                  import: content_google_map
            content_tabs_explorer:
              display: 'Tabs Explorer'
              icon: layout-header-sidebar-left
              fields:
                -
                  import: content_tabs_explorer
