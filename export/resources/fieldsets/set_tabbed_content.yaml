title: 'Set - Tabbed Content'
fields:
  -
    handle: tab_items
    field:
      collapse: true
      type: replicator
      display: 'Tab Items'
      sets:
        tabs_group:
          display: 'Tabs Group'
          sets:
            tab_item:
              display: 'Tab Item'
              icon: layout-table-column-insert
              fields:
                -
                  handle: tab_title
                  field:
                    type: text
                    display: 'Tab Title'
                -
                  handle: image
                  field:
                    mode: grid
                    container: assets
                    type: assets
                    display: Image
                -
                  handle: tab_content
                  field:
                    restrict: false
                    buttons:
                      - h3
                      - h4
                      - bold
                      - italic
                      - unorderedlist
                      - orderedlist
                      - link
                    automatic_line_breaks: true
                    automatic_links: false
                    escape_markup: false
                    heading_anchors: false
                    smartypants: false
                    table_of_contents: false
                    type: bard
                    display: 'Tab Content'
                    remove_empty_nodes: false
