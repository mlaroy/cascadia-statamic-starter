title: 'Side Tabs Explorer'
fields:
  -
    import: content_group
  -
    handle: tab_items
    field:
      type: replicator
      display: 'Tab Items'
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            tab_item:
              display: 'Tab Item'
              fields:
                -
                  handle: title
                  field:
                    input_type: text
                    antlers: false
                    type: text
                    display: Title
                    instructions: 'This is used as the Tab text to activate this item'
                    listable: hidden
                    instructions_position: above
                    visibility: visible
                    replicator_preview: true
                    hide_display: false
                -
                  handle: image
                  field:
                    mode: list
                    container: assets
                    restrict: false
                    allow_uploads: true
                    show_filename: true
                    show_set_alt: true
                    type: assets
                    display: Image
                    listable: hidden
                    instructions_position: above
                    visibility: visible
                    replicator_preview: true
                    hide_display: false
                -
                  handle: description
                  field:
                    restrict: false
                    buttons:
                      - h4
                      - h4
                      - bold
                      - italic
                      - link
                    automatic_line_breaks: true
                    automatic_links: false
                    escape_markup: false
                    heading_anchors: false
                    smartypants: false
                    table_of_contents: false
                    antlers: false
                    type: bard
                    display: Description
                    listable: hidden
                    instructions_position: above
                    visibility: visible
                    replicator_preview: true
                    hide_display: false
