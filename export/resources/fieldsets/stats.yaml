title: Stats
fields:
  -
    handle: eyebrow_text
    field:
      type: text
      display: 'Eyebrow Text'
  -
    handle: heading
    field:
      type: text
      display: Heading
  -
    handle: stat_items
    field:
      collapse: true
      max_sets: 3
      type: replicator
      display: 'Stat Items'
      sets:
        new_set_group:
          display: 'New Set Group'
          sets:
            stat_item:
              display: 'Stat Item'
              fields:
                -
                  handle: stat_value
                  field:
                    type: text
                    display: 'Stat Value'
                    instructions: 'Large text, the most prominent part!'
                -
                  handle: stat_heading
                  field:
                    type: text
                    display: 'Stat Heading'
                -
                  handle: stat_description
                  field:
                    buttons:
                      - bold
                      - italic
                    type: markdown
                    display: 'Stat Description'
