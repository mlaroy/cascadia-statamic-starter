{{ _htag = heading_size ? heading_size : 'h3' }}

<article class="bg-surface-muted h-full">
    <a href="{{ url }}" class="aspect-video overflow-hidden relative block">
        <s:glide :src="image" width="1600" height="1200">
            <img loading="lazy" src="{{ url }}" alt="{{ alt }}" width="1600" height="1200" class="object-cover object-center absolute inset-0 w-full h-full hover:scale-105 transition-transform duration-300">
        </s:glide>
        <span class="sr-only">Read more about{{ title }}</span>
    </a>
    <div class="blog-teaser-content p-4">
        <time class="eyebrow block mb-2 text-body-muted">{{ date }}</time>
        <{{ _htag }} class="text-xl lg:text-2xl font-semibold text-body">
            <a href="{{ url }}">{{ title }}</a>
        </{{ _htag }}>
        <div class="text-gray-600 text-sm my-4">
            {{ excerpt | safe_truncate(150, '...') }}
        </div>
        <a href="{{ url }}" class="underline text-link text-sm">Read More
            <span class="sr-only">about {{ title }}</span>
        </a>
    </div>
</article>
