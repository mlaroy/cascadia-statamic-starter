{{ if (linked_entry || link_to_external) && link_style }}
    {{# Use custom button_text for external links or when override is set; otherwise use the linked entry's title #}}
    {{ _button_text = (link_to_external || (override_link_text && linked_entry)) ? button_text : linked_entry:title }}
    <div class="mt-8">
        <s:partial:components.button
            :href="linked_entry:url"
            :text="_button_text"
            :variant="link_style"
        />
    </div>
{{ /if }}
