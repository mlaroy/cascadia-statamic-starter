<!-- Slideover -->
<div
    x-show="isOffcanvasOpen"
    x-cloak
    x-on:keydown.escape.prevent.stop="isOffcanvasOpen = false"
    role="dialog"
    aria-modal="true"
    x-id="['offcanvas-title']"
    class="fixed inset-0 overflow-hidden z-50"
>
    <!-- Overlay -->
    <div x-show="isOffcanvasOpen" x-on:click="isOffcanvasOpen = !isOffcanvasOpen" x-transition.opacity class="fixed inset-0 bg-black/50"></div>

    <!-- Panel -->
    <div class="fixed inset-y-0 right-0 max-w-lg w-full">
        <div
            x-transition:enter="ease-out duration-300"
            x-transition:enter-start="translate-x-full"
            x-transition:enter-end="translate-x-0"
            x-transition:leave="ease-in duration-300"
            x-transition:leave-start="translate-x-0"
            x-transition:leave-end="translate-x-full"
            x-show="isOffcanvasOpen"
            x-cloak
            class="h-full w-full transform transition-all"
        >
            <div class="h-full flex flex-col justify-between bg-surface shadow-lg overflow-y-auto theme-accent-dark" x-trap="isOffcanvasOpen">
                <!-- Close Button -->
                <div class="absolute top-0 right-0 pt-4 pr-4">
                    <button type="button" @click="isOffcanvasOpen = false" class=" rounded-lg p-2 text-link focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 cursor-pointer">
                        <span class="sr-only">Close slideover</span>

                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>

                <!-- Body -->
                <div class="p-8">

                    {{ if brand_assets:light_logo }}
                        <a href="/" class="font-semibold text-lg">
                            {{ glide :src="brand_assets:light_logo" width="200" }}
                                <img src="{{ url }}" alt="{{ alt }}" class="h-12 w-auto">
                            {{ /glide }}
                        </a>
                    {{ /if }}
                    <!-- Title -->
                    <h2 :id="$id('offcanvas-title')" class="sr-only">Menu</h2>

                    <!-- Content -->
                    <nav class="mt-16 text-center">
                        <ul class="text-xl lg:text-2xl font-bold space-y-4">
                            {{ partial:nav.secondary }}
                        </ul>
                    </nav>
                </div>

                <!-- Footer -->
                <div class="p-4 flex justify-end space-x-2">
                    <button type="button" x-on:click="isOffcanvasOpen = false" class="button-ghost">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
