{{ partial:page_blocks.component }}
    <div class="accordion-container py-16 lg:py-24 bg-surface">
        <div class="container">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                <div class="col-span-1 mb-8">
                    {{ partial:components.content_group
                        :eyebrow_text="eyebrow_text"
                        :heading="heading"
                        :content="description"
                    }}
                </div>

                <div class="col-span-1">
                    <div class="flex flex-col divide-y divide-border border-b border-border">
                        {{ if accordion_group }}
                            {{ partial:components.accordion :items="accordion_group" }}
                        {{ /if }}
                    </div>
                </div>
            </div>
        </div>
    </div>
{{ /partial:page_blocks.component }}
<!-- /_accordion.antlers.html -->
