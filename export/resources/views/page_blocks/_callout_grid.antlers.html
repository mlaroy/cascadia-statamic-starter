{{ partial:partials.section }}
    <div class="callout-grid py-16 lg:py-24 bg-surface">
        <div class="container space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16">
                {{ callout_item }}
                    <div class="flex gap-8">
                        {{ if grid_image }}
                            <div class="flex-shrink-0 flex items-start justify-center mr-4">
                                {{ glide:grid_image width="200" height="200" }}
                                    <img src="{{ url }}" alt="{{ alt }}" width="200" height="200" class="object-cover object-center block size-20">
                                {{ /glide:grid_image }}
                            </div>
                        {{ /if }}
                        <div>
                            <h3 class="text-xl lg:text-2xl font-semibold mb-4 text-body text-balance">{{ grid_headline }}</h3>
                            <div class="mb-4 text-body-muted-dark text-lg text-balance">
                                {{ grid_content }}
                            </div>
                        </div>
                    </div>
                {{ /callout_item }}
            </div>
        </div>
    </div>
{{ /partial:partials.section }}
