<!-- /_stats.antlers.html -->
{{ partial:page_blocks.component }}
    <div class="stats-container py-16 lg:py-24 bg-surface text-body">
        <div class="container">
            <div class="text-center">
                {{ partial:components.content_group
                    :eyebrow_text="eyebrow_text"
                    :heading="heading"
                     center="desktop"
                }}
            </div>
            <div class="grid gap-8 grid-cols-1 md:grid-cols-3 mt-16 lg:mt-24">
                {{ stat_items }}
                    <div class="flex flex-col justify-center item-center text-center">
                        <p class="font-bold text-2xl lg:text-7xl" aria-hidden="true">{{ stat_value }}</p>
                        <h3 class="text-xl mt-2 font-semibold">
                            <span class="sr-only">{{ stat_value }}</span>
                            {{ stat_heading }}
                        </h3>
                        <div class="mt-4 text-sm text-body-muted">
                            {{ stat_description }}
                        </div>
                    </div>
                {{ /stat_items }}
            </div>

        </div>
    </div>
{{ /partial:page_blocks.component }}
<!-- /_stats.antlers.html -->
