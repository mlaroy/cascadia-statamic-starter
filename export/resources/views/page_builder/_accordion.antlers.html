{{#
    @name Accordion
    @desc The Accordion page builder block.
    @set page.page_builder.accordion
#}}

<!-- /page_builder/_accordion.antlers.html -->
{{ partial:page_builder/block }}
    <div class="accordion-container py-16 lg:py-24 bg-surface">
        <div class="container">
            <div class="grid grid-cols-1 md:grid-cols-3 grid-gap-16">
                <div class="col-span-3 md:col-span-1">
                    <h2 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl mb-8 font-semibold text-heading">{{ heading }}</h2>
                </div>

                <div class="col-span-1 md:col-span-2">
                    <div class="flex flex-col divide-y divide-border border-b border-border">
                        {{ if accordion_group }}
                            {{ partial:components.accordion :items="accordion_group" }}
                        {{ /if }}
                    </div>
                </div>
            </div>
        </div>
    </div>
{{ /partial:page_builder/block }}
<!-- End: /page_builder/_accordion.antlers.html -->
