{{# Splide carousel. Expects images / auto_play / items_to_show / show_index in context; pass `class` for container spacing. #}}
<div class="carousel-container overflow-hidden {{ class }}" x-data="carousel({ autoPlay: {{ auto_play ? 'true' : 'false' }}, perPage: {{ items_to_show || 1 }} })">
    <div class="splide w-full" x-ref="carousel">
        <div class="splide__track">
            <ul class="splide__list">
                {{ images }}
                    <li class="splide__slide relative aspect-video w-full">
                        {{ glide :src="url" width="1200" height="800" }}
                            <img src="{{ url }}" alt="{{ alt }}" width="1200" height="800" class="object-cover object-center w-full h-full" loading="lazy">
                        {{ /glide }}
                    </li>
                {{ /images }}
            </ul>
        </div>
    </div>

    {{ if show_index }}
    <div class="flex justify-end mt-2 text-sm text-body-muted">
        <span x-text="activeIndex + 1"></span> / <span>{{ images | count }}</span>
    </div>
    {{ /if }}

    <div class="flex justify-center gap-8 text-center mx-auto text-body {{ if !show_index }} mt-4 {{ /if }}">
        <button @click="prevSlide" x-bind:disabled="isPrevDisabled" class="disabled:opacity-50 size-12 flex items-center justify-center cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
            <span class="sr-only">Previous</span>
        </button>
        <button @click="nextSlide" x-bind:disabled="isNextDisabled" class="disabled:opacity-50 size-12 flex items-center justify-center cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
            <span class="sr-only">Next</span>
        </button>
    </div>
</div>
