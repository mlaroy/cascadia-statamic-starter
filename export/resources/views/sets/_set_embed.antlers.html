<div class="set-embed embed-{{ provider }} not-prose my-12">
    {{ if provider == "twitter" }}
        <blockquote class="twitter-tweet"><a href="{{ url }}"></a></blockquote>
        <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    {{ elseif provider == "youtube" || provider == "vimeo" }}
        <div class="w-full aspect-video relative">
            <iframe
                src="{{ url | embed_url }}"
                class="w-full h-full absolute top-0 left-0 border-none"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
            ></iframe>
        </div>
    {{ else }}
        <div class="embed-fallback">
            <a href="{{ url }}" target="_blank" rel="noopener" class="text-link underline hover:text-link-hover">{{ url }}</a>
        </div>
    {{ /if }}
</div>
