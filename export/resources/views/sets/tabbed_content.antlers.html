<div class="tabbed-content not-prose" x-data="{ activeTab: '{{ tab_items[0]tab_title | slugify }}' }">
    <div class="tab-buttons flex gap-0">
        {{ tab_items }}
            <button
                @click="activeTab = '{{ tab_title | slugify }}'"
                class="tab-item text-sm rounded px-4 py-2 cursor-pointer"
                :class="{ 'bg-surface': activeTab == '{{ tab_title | slugify }}' }"
                >
                {{ tab_title }}
            </button>
        {{ /tab_items }}
    </div>

    <div class="tab-items p-4 rounded border border-surface bg-surface">
        {{ tab_items }}
            <div class="tab-item text-xs" x-show="activeTab == '{{ tab_title | slugify }}' ">
                <div class="flex gap-4">
                    <div class="flex-1">
                        <div class="image-container relative aspect-video bg-black w-2/3 mb-2 rounded overflow-hidden">
                            <s:glide :src="image" width="600" height="400">
                                <img src="{{ url }}" alt="{{ alt }}" class="absolute inset-0 w-full h-full block object-cover">
                            </s:glide>
                        </div>
                    </div>
                </div>
                <div>
                    <h2 class="font-semibold mb-2">{{ tab_title }}</h2>
                    <div class="tab-content text-body-muted">
                        {{ tab_content }}
                    </div>
                </div>
            </div>
        {{ /tab_items }}
    </div>
</div>
