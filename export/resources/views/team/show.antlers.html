<s:partial:partials.page_header />

<div class="container mt-16">
    <div class="grid lg:grid-cols-8 gap-16">
        <div class="lg:col-span-3">
            <s:glide :src="headshot" width="800" height="600">
                <img src="{{ url }}" alt="{{ alt }}" class="block max-w-full">
            </s:glide>
        </div>
        <div class="lg:col-span-5 pb-16 lg:pt-16">
            <h1 class="text-2xl md:text-3xl lg:text-4xl font-semibold mb-4">{{ title }}</h1>
            <div class="prose lg:prose-xl prose-p:text-body-muted">
                {{ content }}
            </div>
            <div class="mt-8">
                {{ if position }}
                    <p class="font-semibold text-body-muted-dark">{{ position }}</span>
                {{ /if }}
                {{ if email }}
                    <p class="text-sm text-slate-900/80">
                        <a href="mailto:{{ email | obfuscate }}" class="text-link hover:text-link-hover transition">
                            {{ email | obfuscate }}
                        </a>
                    </p>
                {{ /if }}

                {{ if social_links }}
                    <ul class="flex gap-4 mt-4">
                        {{ social_links }}
                            <li>
                                <a href="{{ link }}" class="underline text-body-muted hover:text-muted-dark">
                                    <span class="size-8 block">
                                        <s:partial src="icons/{social_platform:value}" />
                                    </span>
                                    <span class="sr-only">{{ social_platform:label }}</span>
                                </a>
                            </li>
                        {{ /social_links }}
                    </ul>
                {{ /if }}
            </div>
        </div>
    </div>
</div>
